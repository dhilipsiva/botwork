# A WebAssembly module of Botwork statements; see docs/wasm.md. Build it with
# `cargo build --release --target wasm32-wasip2`.
[package]
name = "botwork-greeter"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
