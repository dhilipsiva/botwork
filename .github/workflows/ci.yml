name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs every check before building what it publishes.
  workflow_call:

permissions:
  contents: read

# Called by the release workflow, github.workflow names the caller, so a
# release's checks neither cancel nor are cancelled by the ref's own CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.profile }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # The JavaScript statement tests use the runners' Node, and the package
      # tests their git, rather than skip.
      BOTWORK_REQUIRE_NODE: "1"
      BOTWORK_REQUIRE_GIT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flags: ""
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            timeout: 15
          - profile: release
            flags: --release
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            timeout: 15
          - profile: debug
            flags: ""
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            timeout: 15
          - profile: release
            flags: --release
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            timeout: 15
          # macOS refuses the process-tree and namespace worker modes, and
          # tests/platform_gaps.rs checks that they fail clearly there
          # (decision D12).
          - profile: debug
            flags: ""
            target: aarch64-apple-darwin
            os: macos-latest
            timeout: 30
          - profile: release
            flags: --release
            target: aarch64-apple-darwin
            os: macos-latest
            timeout: 30
          - profile: debug
            flags: ""
            target: x86_64-pc-windows-msvc
            os: windows-latest
            timeout: 40
          - profile: release
            flags: --release
            target: x86_64-pc-windows-msvc
            os: windows-latest
            timeout: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and checking tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Check formatting
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo +stable fmt --all -- --check
      - name: Check Clippy warnings
        if: matrix.profile == 'debug'
        run: cargo +stable clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Check coverage reporting helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/coverage_tools.py
      - name: Check fuzz campaign helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/fuzz_tools.py
      - name: Check mutation campaign helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/mutation_tools.py
      - name: Check release packaging helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/release_tools.py
      - name: Check public API helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/api_tools.py
      - name: Check WebAssembly guest helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/wasm_tools.py
      - name: Build all targets
        run: cargo +stable build --locked --all-targets --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Check performance measurement helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/performance_tools.py
      - name: Check benchmark workload correctness (no performance threshold)
        # The measurement harness is Linux-only, like the reference host (D3).
        if: runner.os == 'Linux'
        run: python3 scripts/performance.py --smoke --profile ${{ matrix.profile }} --target ${{ matrix.target }}
      - name: Record the worker platform
        # The kernel, distribution, libc, and facility limits the worker
        # suites ran on; docs/worker-platforms.md lists those observed.
        if: runner.os == 'Linux'
        run: bash scripts/worker_platform.sh
      - name: Allow unprivileged user namespaces for isolated workers
        # Ubuntu runners restrict them through AppArmor; PID-namespace worker tests
        # need them, as docs/isolated-workers.md requires of deployments.
        if: runner.os == 'Linux'
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Warm Node's files
        # A hosted Windows runner reads node.exe from a cold disk. Its first
        # starts that run a script take from seconds to over a minute, longer
        # than the 30-second worker deadline of the JavaScript tests' imports;
        # later starts take a tenth of a second.
        if: runner.os == 'Windows'
        shell: bash
        run: node --input-type=module -e "await import('node:url'); console.log(process.version)"
      - name: Use the runner's chromedriver for the WebDriver tests
        # Hosted Linux runners ship Chrome with a matching chromedriver, so the
        # real browser test runs there and cannot be skipped (decision D11).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "BOTWORK_WEBDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          echo "BOTWORK_REQUIRE_WEBDRIVER=1" >> "$GITHUB_ENV"
      - name: Run tests and examples
        run: cargo +stable test --locked --no-fail-fast --target ${{ matrix.target }} ${{ matrix.flags }}

  # The worker boundary on an older Ubuntu release than ubuntu-latest, with its
  # own kernel and util-linux (docs/worker-platforms.md). Its glibc 2.35 cannot
  # load GNU builds made from a checkout, which pack relative relocations and
  # need glibc 2.36 (decision D19), so the static musl build, the one the
  # release ships, is the one that runs there.
  worker-platforms:
    name: Worker platforms (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BOTWORK_REQUIRE_NODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        target: [x86_64-unknown-linux-musl]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Record the worker platform
        run: bash scripts/worker_platform.sh
      - name: Allow unprivileged user namespaces for isolated workers
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the worker, process, and shutdown suites
        run: >-
          cargo +stable test --locked --no-fail-fast --target ${{ matrix.target }}
          --test isolated_workers --test typed_workers --test worker_trees
          --test worker_recovery --test worker_namespaces --test worker_facilities
          --test worker_backends --test processes --test shutdown
          --test terminal_outcomes --test javascript_adapter

  python:
    name: Python adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and checking tools
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install the Python development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-dev
      - name: Install Python
        # macOS and Windows link the interpreter this installs.
        if: runner.os != 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Report the Python
        run: python3 --version || python --version
      - name: Check Clippy warnings with Python
        run: cargo +stable clippy --locked --features python --all-targets -- -D warnings
      - name: Allow unprivileged user namespaces for isolated workers
        # As in the Rust jobs: the PID-namespace worker tests need them.
        if: runner.os == 'Linux'
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Warm Node's files
        # A hosted Windows runner reads node.exe from a cold disk. Its first
        # starts that run a script take from seconds to over a minute, longer
        # than the 30-second worker deadline of the JavaScript tests' imports;
        # later starts take a tenth of a second.
        if: runner.os == 'Windows'
        shell: bash
        run: node --input-type=module -e "await import('node:url'); console.log(process.version)"
      - name: Run tests and examples with Python
        run: cargo +stable test --locked --no-fail-fast --features python

  public-api:
    name: Public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the recorded nightly toolchain
        # Rustdoc's JSON output is unstable; this toolchain writes format 61.
        run: rustup toolchain install nightly-2026-08-14 --profile minimal
      - name: Describe the public API
        run: cargo +nightly-2026-08-14 rustdoc --lib --locked -- -Z unstable-options --output-format json
      - name: Check that no public signature names an internal item
        run: python3 scripts/public_api.py --leaks target/doc/botwork.json
      - name: Check that the API matches docs/public-api.txt
        # A change to the API must update the listing; see docs/rust-api.md.
        run: |
          python3 scripts/public_api.py target/doc/botwork.json > "$RUNNER_TEMP/public-api.txt"
          diff --unified docs/public-api.txt "$RUNNER_TEMP/public-api.txt"

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl --silent --show-error --location --fail --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
      - name: Check the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  wasm:
    name: WebAssembly guest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust with the WASI Preview 2 target
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-wasip2
      - name: Check that the committed component matches its sources
        run: python3 scripts/wasm_guest.py check
      - name: Rebuild the component and run the tests against it
        env:
          BOTWORK_WASM_GUEST: ${{ runner.temp }}/statements.wasm
        run: |
          python3 scripts/wasm_guest.py build "$BOTWORK_WASM_GUEST"
          cargo +stable test --locked --test wasm_adapter
      - name: Build and run the documented example
        run: |
          cargo +stable build --locked --bin botwork
          python3 scripts/wasm_guest.py example target/debug/botwork
      - name: Check Clippy warnings without the wasm feature
        run: cargo +stable clippy --locked --no-default-features --all-targets -- -D warnings

  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install the pinned Playwright and its Chromium
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the Playwright tests against them (decision D11)
        env:
          BOTWORK_REQUIRE_NODE: "1"
          BOTWORK_REQUIRE_PLAYWRIGHT: "1"
        run: BOTWORK_PLAYWRIGHT="$PWD/tests/playwright" cargo +stable test --locked --test playwright --test browser_examples --test browser_failures

  appium:
    name: Appium (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build the Appium tests before the emulator starts
        run: cargo +stable test --locked --test appium --test browser_examples --test browser_failures --no-run
      - name: Install the pinned Appium and its UiAutomator2 driver
        working-directory: tests/appium
        env:
          APPIUM_HOME: ${{ github.workspace }}/tests/appium
        run: |
          npm ci
          npx appium driver install --source=npm appium-uiautomator2-driver@8.7.0
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the Appium test on an Android 14 emulator (decision D11)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APPIUM_HOME: ${{ github.workspace }}/tests/appium
          BOTWORK_REQUIRE_APPIUM: "1"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: BOTWORK_APPIUM="$PWD/tests/appium/node_modules/.bin/appium" cargo +stable test --locked --test appium --test browser_examples --test browser_failures

  tree-sitter:
    name: Tree-sitter grammars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install the Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.9
      - name: Run the grammar corpus tests
        run: |
          (cd editors/tree-sitter-botwork/botwork && tree-sitter test)
          (cd editors/tree-sitter-botwork/suite && tree-sitter test)
      - name: Check agreement with the interpreter and the generated parsers
        env:
          BOTWORK_REQUIRE_TREE_SITTER: "1"
        run: cargo +stable test --locked --test tree_sitter

  editors:
    name: Editor packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Helix configuration pins a grammar revision from the history.
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install --yes vim
      - name: Install Helix 25.07.1
        run: |
          cd "$RUNNER_TEMP"
          curl --silent --show-error --location --fail --output helix.tar.xz \
            https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz
          echo "3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b  helix.tar.xz" | sha256sum --check
          tar --extract --xz --file helix.tar.xz
          echo "$RUNNER_TEMP/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Install the Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.9
      - name: Install the VS Code extension's locked dependencies
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: npm run package
      - name: Check the editor packages and their alignment
        env:
          BOTWORK_REQUIRE_EDITORS: all
        run: cargo +stable test --locked --test editors --test alignment

  fuzz:
    name: Seeded fuzz smoke (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the recorded fuzz toolchain
        run: rustup toolchain install nightly-2026-08-14 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz target formatting
        run: cargo +stable fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Run fixed smoke budgets
        run: python3 scripts/fuzz_smoke.py
      - name: Preserve campaign logs, corpus, and failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-${{ github.sha }}
          path: target/fuzz-smoke/
          if-no-files-found: warn
          retention-days: 30
