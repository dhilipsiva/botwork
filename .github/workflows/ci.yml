name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust (${{ matrix.profile }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flags: ""
            target: x86_64-unknown-linux-gnu
          - profile: release
            flags: --release
            target: x86_64-unknown-linux-gnu
          - profile: debug
            flags: ""
            target: x86_64-unknown-linux-musl
          - profile: release
            flags: --release
            target: x86_64-unknown-linux-musl
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and checking tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Check formatting
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo +stable fmt --all -- --check
      - name: Check Clippy warnings
        if: matrix.profile == 'debug'
        run: cargo +stable clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Check coverage reporting helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/coverage_tools.py
      - name: Check fuzz campaign helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/fuzz_tools.py
      - name: Check mutation campaign helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/mutation_tools.py
      - name: Build all targets
        run: cargo +stable build --locked --all-targets --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Check performance measurement helper
        if: matrix.profile == 'debug' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tests/performance_tools.py
      - name: Check benchmark workload correctness (no performance threshold)
        run: python3 scripts/performance.py --smoke --profile ${{ matrix.profile }} --target ${{ matrix.target }}
      - name: Allow unprivileged user namespaces for isolated workers
        # Ubuntu runners restrict them through AppArmor; PID-namespace worker tests
        # need them, as docs/isolated-workers.md requires of deployments.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run tests and examples
        run: cargo +stable test --locked --no-fail-fast --target ${{ matrix.target }} ${{ matrix.flags }}

  tree-sitter:
    name: Tree-sitter grammars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install the Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.9
      - name: Run the grammar corpus tests
        run: |
          (cd editors/tree-sitter-botwork/botwork && tree-sitter test)
          (cd editors/tree-sitter-botwork/suite && tree-sitter test)
      - name: Check agreement with the interpreter and the generated parsers
        env:
          BOTWORK_REQUIRE_TREE_SITTER: "1"
        run: cargo +stable test --locked --test tree_sitter

  editors:
    name: Editor packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Helix configuration pins a grammar revision from the history.
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install --yes vim
      - name: Install Helix 25.07.1
        run: |
          cd "$RUNNER_TEMP"
          curl --silent --show-error --location --fail --output helix.tar.xz \
            https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz
          echo "3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b  helix.tar.xz" | sha256sum --check
          tar --extract --xz --file helix.tar.xz
          echo "$RUNNER_TEMP/helix-25.07.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Install the Tree-sitter CLI
        run: npm install --global tree-sitter-cli@0.25.9
      - name: Install the VS Code extension's locked dependencies
        working-directory: editors/vscode
        run: npm ci --no-audit --no-fund
      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: npm run package
      - name: Check the editor packages and their alignment
        env:
          BOTWORK_REQUIRE_EDITORS: all
        run: cargo +stable test --locked --test editors --test alignment

  fuzz:
    name: Seeded fuzz smoke (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the recorded fuzz toolchain
        run: rustup toolchain install nightly-2026-08-14 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz target formatting
        run: cargo +stable fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Run fixed smoke budgets
        run: python3 scripts/fuzz_smoke.py
      - name: Preserve campaign logs, corpus, and failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-smoke-${{ github.sha }}
          path: target/fuzz-smoke/
          if-no-files-found: warn
          retention-days: 30
