[package]
name = "botwork"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "botwork is a single-binary, generic and open-source automation framework written in Rust for acceptance testing, acceptance test driven development (ATDD), and robotic process automation (RPA). The syntax is basically plain text (in any human language) with parameters. Easily extendible with Rust, Python & JavaScript. An efficient, fast alternative to Robot Framework."
documentation = "https://docs.rs/botwork"
homepage = "https://github.com/dhilipsiva/botwork"
repository = "https://github.com/dhilipsiva/botwork"
readme = "README.md"
# Evidence records document the repository's checks; the crate needs none of them.
exclude = ["docs/*-evidence.json"]
keywords = ["botwork", "robotframework", "testing", "ATDD", "rpa"]
categories = ["science::robotics", "development-tools", "development-tools::testing"]

[lib]
name = "botwork"

[[bin]]
name = "botwork"

[[bench]]
name = "runtime"
harness = false

# Runs on the process's main thread, which the test harness does not use.
[[test]]
name = "main_thread_stack"
harness = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
clap = { version = "4.2.2", features = ["derive"] }
lazy_static = "1.4.0"
log = "0.4.17"
pest = "2.5.7"
pest_derive = "2.5.7"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "1.0.40"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.9.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
url = "2.5.8"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# The Windows worker backend (Job Objects, suspended launch, and pipes read and
# written without waiting), its journal (files opened relative to a private
# directory), and console interrupts.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }

# The distributed binary (roadmap decision D19): one codegen unit with fat LTO
# makes it smaller and faster to start. `release` stays the quick default, so
# `cargo test --release` does not link every test binary with LTO.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
